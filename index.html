<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>devjd.com — 一个写代码的独立开发者</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide 图标库 -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        // 重置 Tailwind 默认字体族，苹果系统优先使用苹方，Windows优先使用微软雅黑，无缝过渡且绝不混杂西文字体
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"PingFang SC"', '"Hiragino Sans GB"', '"Microsoft YaHei"', '"微软雅黑"', 'sans-serif'],
                        mono: ['-apple-system', 'BlinkMacSystemFont', '"PingFang SC"', '"Hiragino Sans GB"', '"Microsoft YaHei"', '"微软雅黑"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            light: '#059669', // 翡翠绿
                            dark: '#34d399',
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        /* 强制全站所有元素（包含代码块、输入框、按钮等）统一字体，避免由于英文或特殊标记导致字体割裂 */
        *, *::before, *::after, body, button, input, select, textarea, pre, code {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "微软雅黑", sans-serif !important;
        }

        /* 极简滚动条 */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.15);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.35);
        }

        /* 渐进式淡入动画 */
        @keyframes slide-enter {
            0% {
                transform: translateY(15px);
                opacity: 0;
                filter: blur(2px);
            }
            100% {
                transform: translateY(0);
                opacity: 1;
                filter: blur(0);
            }
        }

        .stagger-container > * {
            opacity: 0;
            animation: slide-enter 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .stagger-container > *:nth-child(1) { animation-delay: 40ms; }
        .stagger-container > *:nth-child(2) { animation-delay: 100ms; }
        .stagger-container > *:nth-child(3) { animation-delay: 160ms; }
        .stagger-container > *:nth-child(4) { animation-delay: 220ms; }
        .stagger-container > *:nth-child(5) { animation-delay: 280ms; }
        .stagger-container > *:nth-child(6) { animation-delay: 340ms; }
        .stagger-container > *:nth-child(7) { animation-delay: 400ms; }

        body {
            font-feature-settings: "cv02", "cv03", "cv04", "cv11";
            word-spacing: -0.02em;
            letter-spacing: -0.01em;
        }

        /* 二维随机生长画布 */
        #plum-canvas {
            pointer-events: none;
            position: fixed;
            top: 0;
            left: 0;
            z-index: -10;
            width: 100vw;
            height: 100vh;
            opacity: 0.35;
        }
        
        .project-card {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .project-card:hover {
            transform: translateY(-2px);
        }
    </style>
</head>

         * STREAMING_CHUNK: 初始化分支生长艺术 Canvas 绘图引擎...
         */
        const canvas = document.getElementById('plum-canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        
        let steps = [];
        let prevSteps = [];
        let iterations = 0;

        function initCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            regenerateTree();
        }

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            regenerateTree();
        });

        function random() {
            return Math.random();
        }

        function regenerateTree() {
            ctx.clearRect(0, 0, width, height);
            steps = [];
            prevSteps = [];
            iterations = 0;

            const isDark = document.documentElement.classList.contains('dark');
            ctx.strokeStyle = isDark ? 'rgba(255, 255, 255, 0.12)' : 'rgba(0, 0, 0, 0.05)';
            ctx.lineWidth = 1;

            if (width > 768) {
                // 宽屏时：自右向左自然延伸
                startBranch(width, height * 0.12, -Math.PI, 14);
                startBranch(width, height * 0.68, -Math.PI / 1.4, 11);
            } else {
                // 窄屏时：自下向上自然延伸
                startBranch(width * 0.5, height, -Math.PI / 2, 9);
            }

            animateTree();
        }

        function startBranch(x, y, rad, length) {
            steps.push(() => branch(x, y, rad, length));
        }

        function branch(x, y, rad, length) {
            if (length < 1.8 || random() < 0.05) return;

            const nx = x + Math.cos(rad) * length;
            const ny = y + Math.sin(rad) * length;

            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(nx, ny);
            ctx.stroke();

            const rate = 0.52;
            if (random() < rate) {
                steps.push(() => branch(nx, ny, rad + (random() * 0.38 - 0.19), length * 0.95));
            }
            if (random() < rate) {
                steps.push(() => branch(nx, ny, rad - (random() * 0.38 - 0.19), length * 0.95));
            }
        }

        function animateTree() {
            if (steps.length === 0) return;
            prevSteps = [...steps];
            steps = [];
            prevSteps.forEach(fn => fn());
            
            iterations++;
            if (iterations < 90) {
                requestAnimationFrame(animateTree);
            }
        }
