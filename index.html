            100% {

        const canvas = document.getElementById('plum-canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        
        let steps = [];
        let prevSteps = [];
        let iterations = 0;

        function initCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            regenerateTree();
        }

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            regenerateTree();
        });

        function random() {
            return Math.random();
        }

        function regenerateTree() {
            ctx.clearRect(0, 0, width, height);
            steps = [];
            prevSteps = [];
            iterations = 0;

            const isDark = document.documentElement.classList.contains('dark');
            ctx.strokeStyle = isDark ? 'rgba(255, 255, 255, 0.12)' : 'rgba(0, 0, 0, 0.05)';
            ctx.lineWidth = 1;

            if (width > 768) {
                // 宽屏时：自右向左自然延伸
                startBranch(width, height * 0.12, -Math.PI, 14);
                startBranch(width, height * 0.68, -Math.PI / 1.4, 11);
            } else {
                // 窄屏时：自下向上自然延伸
                startBranch(width * 0.5, height, -Math.PI / 2, 9);
            }

            animateTree();
        }

        function startBranch(x, y, rad, length) {
            steps.push(() => branch(x, y, rad, length));
        }

        function branch(x, y, rad, length) {
            if (length < 1.8 || random() < 0.05) return;

            const nx = x + Math.cos(rad) * length;
            const ny = y + Math.sin(rad) * length;

            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(nx, ny);
            ctx.stroke();

            const rate = 0.52;
            if (random() < rate) {
                steps.push(() => branch(nx, ny, rad + (random() * 0.38 - 0.19), length * 0.95));
            }
            if (random() < rate) {
                steps.push(() => branch(nx, ny, rad - (random() * 0.38 - 0.19), length * 0.95));
            }
        }

        function animateTree() {
            if (steps.length === 0) return;
            prevSteps = [...steps];
            steps = [];
            prevSteps.forEach(fn => fn());
            
            iterations++;
            if (iterations < 90) {
                requestAnimationFrame(animateTree);
            }
        }
